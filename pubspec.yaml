name: stock_bar
description: Control de stock y previsión de reposición para el bar.
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  intl: ^0.20.0
  crypto: ^3.0.3
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  sqflite_common_ffi: ^2.3.7+1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/img/la-favorita.png"

flutter:
  uses-material-design: true
  assets:
    - lib/img/
